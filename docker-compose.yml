# QuantCEO OSS — 开源版部署编排
# docker compose -f docker-compose.oss.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    build: ./quant-trading
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PG_HOST: postgres
      PG_DB: quant_ceo
      PG_USER: postgres
      PG_PASSWORD: postgres
    command: >
      sh -c "node dist/server/db/init.js &&
             node dist/server/db/seed.js &&
             node dist/server/db/seed_all_stocks.js && node dist/server/db/seedStrategies.js"

  market-data:
    build: ./market-data
    restart: unless-stopped
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      PORT: "4003"
      PG_HOST: postgres
      PG_DB: quant_ceo
      PG_USER: postgres
      PG_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
    ports: ["4003:4003"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  scan-engine:
    build: ./scan-engine
    restart: unless-stopped
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      PORT: "4004"
      PG_HOST: postgres
      PG_DB: quant_ceo
      PG_USER: postgres
      PG_PASSWORD: postgres
    ports: ["4004:4004"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  indicator-service:
    build: ./indicator-service
    restart: unless-stopped
    ports: ["4005:4005"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backtest-engine:
    build: ./backtest-engine
    restart: unless-stopped
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      PG_HOST: postgres
      PG_DB: quant_ceo
      PG_USER: postgres
      PG_PASSWORD: postgres
    ports: ["4006:4006"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4006/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  quant-trading:
    build: ./quant-trading
    restart: unless-stopped
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      PORT: "4001"
      PG_HOST: postgres
      PG_DB: quant_ceo
      PG_USER: postgres
      PG_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      REDIS_URL: redis://redis:6379
      USE_EXTERNAL_SCHEDULER: "true"
    ports: ["4001:4001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build: ./scheduler
    restart: unless-stopped
    depends_on:
      quant-trading: { condition: service_healthy }
      market-data: { condition: service_healthy }
      scan-engine: { condition: service_healthy }
      backtest-engine: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/index.js' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      quant-trading: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.0
    restart: unless-stopped
    ports: ["9187:9187"]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/quant_ceo?sslmode=disable"

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    ports: ["9121:9121"]
    command: ["--redis.addr", "redis://redis:6379"]

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
