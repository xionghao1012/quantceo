# QuantCEO API Gateway
# Routes traffic to microservices

events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream quant-trading  { server quant-trading:4001; }
  upstream quant-sso       { server quant-sso:3002; }
  upstream quant-ai        { server quant-ai:4002; }
  upstream market-data     { server market-data:4003; }
  upstream scan-engine     { server scan-engine:4004; }
  upstream indicator-svc   { server indicator-service:4005; }
  upstream backtest-engine { server backtest-engine:4006; }
  upstream grafana         { server grafana:3000; }
  upstream prometheus      { server prometheus:9090; }

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # WebSocket support for real-time alerts
    location /ws {
      proxy_pass http://quant-trading/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    # ===== Microservice Routes =====

    # AI routes → quant-ai
    location /api/ai/ {
      proxy_pass http://quant-ai/api/ai/;
      proxy_set_header Host $host;
    }

    # Data routes → market-data
    location /api/data/ {
      proxy_pass http://market-data/api/data/;
      proxy_set_header Host $host;
    }

    # Scan routes → scan-engine
    location /api/scan/ {
      proxy_pass http://scan-engine/api/scan/;
      proxy_set_header Host $host;
    }

    # Indicator routes → indicator-service
    location /api/indicators/ {
      proxy_pass http://indicator-svc/api/indicators/;
      proxy_set_header Host $host;
    }

    # Backtest engine → Python service
    location /api/backtest/ {
      proxy_pass http://backtest-engine/api/backtest/;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }

    # Backtest engine internal
    location /api/internal/strategy-backtest {
      proxy_pass http://backtest-engine/api/internal/strategy-backtest;
      proxy_set_header Host $host;
      proxy_read_timeout 600s;
    }

    # SSO auth
    location /api/auth/ {
      proxy_pass http://quant-sso/api/auth/;
      proxy_set_header Host $host;
    }

    # All other API → quant-trading (main)
    location /api/ {
      proxy_pass http://quant-trading/api/;
      proxy_set_header Host $host;
    }

    # ===== Monitoring =====

    location /grafana/ {
      proxy_pass http://grafana/;
      proxy_set_header Host $host;
    }

    location /prometheus/ {
      proxy_pass http://prometheus/;
      proxy_set_header Host $host;
    }

    # SSO frontend
    location /sso/ {
      proxy_pass http://quant-sso/;
      proxy_set_header Host $host;
    }

    # ===== Frontend → quant-trading =====

    location / {
      proxy_pass http://quant-trading/;
      proxy_set_header Host $host;
    }
  }
}
