global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  - job_name: 'quant-trading'
    static_configs:
      - targets: ['quant-trading:4001']
    metrics_path: '/metrics'

  - job_name: 'quant-ai'
    static_configs:
      - targets: ['quant-ai:4002']
    metrics_path: '/metrics'

  - job_name: 'market-data'
    static_configs:
      - targets: ['market-data:4003']
    metrics_path: '/metrics'

  - job_name: 'scan-engine'
    static_configs:
      - targets: ['scan-engine:4004']
    metrics_path: '/metrics'

  - job_name: 'backtest-engine'
    static_configs:
      - targets: ['backtest-engine:4006']
    metrics_path: '/metrics'

  - job_name: 'indicator-service'
    static_configs:
      - targets: ['indicator-service:4005']
    metrics_path: '/metrics'

  - job_name: 'quant-sso'
    static_configs:
      - targets: ['quant-sso:3002']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
